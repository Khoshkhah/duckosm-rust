site_name: duckOSM Studio
site_description: An OpenStreetMap file to a routable road network (GeoParquet and DuckDB), equal to duckOSM 0.6.0. A browser page. duckOSM has the command line and Python.
site_url: https://khoshkhah.github.io/duckosm-studio/manual/
repo_url: https://github.com/Khoshkhah/duckosm-studio
repo_name: Khoshkhah/duckosm-studio

theme:
  name: material
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
      # GitHub-style anchors, so the in-page links of the docs work on the site too
      slugify: !!python/object/apply:pymdownx.slugs.slugify { kwds: { case: lower } }

plugins:
  - search

# the manual is for the people who use the page: the documents of the developers and the proposals stay in the repository only
exclude_docs: |
  /development.md
  /design.md
  /benchmark.md
  /app.md
  /browser.md
  /osm-editing.md
  /features.md
  /levels.md
  /lane_profile.md
  /bus.md
  /edge_graph.md
  /boundary_tool.md
  /relay.md
  /tables.md
  /todo.md
  /wall-types.md
  /proposals/

nav:
  - Home: index.md
  - Manual:
      - The editing cycle: manual/cycle.md
      - The page: dashboard.md
      - "Steps 1 and 2: The area": manual/area.md
      - "Steps 3 and 4: Data and build": manual/build.md
      - "Steps 5 and 6: Result and map": manual/result.md
      - "Step 7: Edit OSM data": manual/edit-osm.md
      - "Step 8: Edit levels": manual/edit-levels.md
      - "Step 9: Edit design": manual/edit-design.md
      - "Step 10: Export": manual/export.md
      - The tables: manual/tables.md
  - Get started:
      - Your first map: first_map.md
      - Concepts: concepts.md
  - Command line and Python:
      - Use duckOSM: cli.md
  - Reference:
      - Columns of the tables: output-tables.md
      - When the page does not work: troubleshooting.md
