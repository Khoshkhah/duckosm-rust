# CI for duckosm-rust (github.com/Khoshkhah/duckosm-rust). The runner names and action versions
# come from `maturin generate-ci github` (maturin 1.15.0).
#
# The wheels are abi3 (Python 3.9 and newer), so one wheel for each system is enough. They contain DuckDB
# (cargo feature `duckdb`), so a build takes several minutes. Publishing to PyPI is NOT done here: the name
# question (DuckDB trademark) is open. Add a publish job when Kaveh decides.
name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: cargo test, and the WebAssembly build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # one invocation compiles DuckDB one time
      - name: Tests of the core, the DuckDB hash, the Parquet writer and the build (golden files, config, lane profile, levels)
        run: cargo test --release -p duckosm-core -p duckosm-duckdb -p duckosm-parquet -p duckosm-build
      - name: The WebAssembly module builds, and its byte functions give the files of the path functions
        run: |
          cargo build --release -p duckosm-wasm --target wasm32-unknown-unknown
          cargo test --release -p duckosm-wasm
      - name: Nightly Rust for the WebAssembly module with threads
        run: rustup toolchain install nightly-2026-10-15 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Both WebAssembly modules of the page build (one thread, and threads)
        run: ./crates/duckosm-wasm/build.sh
      # The test of duckosm-wasm wrote the native files and fixes.yaml to target/tmp/<checkout folder> (one folder for
      # each checkout, because worktrees can share target/). The metadata and the levels metadata hold the build time
      # and the time zone, so they are not compared.
      - name: The WebAssembly module in Node writes the files of the native build (Monaco)
        run: |
          t=target/tmp/$(basename "$PWD")
          node crates/duckosm-wasm/www/run_node.mjs tests/data/monaco.osm.pbf out-node driving,walking,cycling $t/fixes.yaml
          test $(ls out-node | wc -l) = $(ls $t/duckosm-wasm-native | wc -l)
          for f in out-node/*; do
            case ${f##*/} in visualization_metadata_main.parquet|edge_levels_meta_visualization.parquet) continue;; esac
            cmp $f $t/duckosm-wasm-native/${f##*/}
          done

  # The wheels take about 40 minutes on 5 systems, so they build only for a tag (a release) or by hand.
  wheels:
    name: wheel ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64, runner: ubuntu-22.04, target: x86_64, manylinux: "2_28"}
          - {name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28"}
          - {name: macos-x86_64, runner: macos-15-intel, target: x86_64}
          - {name: macos-aarch64, runner: macos-latest, target: aarch64}
          - {name: windows-x64, runner: windows-latest, target: x64}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path crates/duckosm-py/Cargo.toml
          manylinux: ${{ matrix.manylinux || 'auto' }}
          # No sccache on Windows: sccache 0.16.0 puts /WX- after -Tp, and cl.exe then reads /WX- as
          # the source file of a DuckDB .cc file (fatal error C1083).
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') && matrix.name != 'windows-x64' }}
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.name }}
          path: dist
      - name: Test the wheel in a new virtual environment (Monaco must equal duckOSM)
        shell: bash
        run: |
          set -e
          python -m venv test-env
          if [ -f test-env/Scripts/activate ]; then source test-env/Scripts/activate; else source test-env/bin/activate; fi
          pip install duckdb==1.5.3
          pip install duckosm-rust --no-index --no-deps --find-links dist --force-reinstall
          python tests/test_wheel.py

  # The CLI program for the same systems, as one archive for each system. The Linux program needs glibc 2.35 or
  # newer (the runner's glibc).
  cli:
    name: CLI ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64, runner: ubuntu-22.04}
          - {name: linux-aarch64, runner: ubuntu-22.04-arm}
          - {name: macos-x86_64, runner: macos-15-intel}
          - {name: macos-aarch64, runner: macos-latest}
          - {name: windows-x64, runner: windows-latest}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the CLI
        run: cargo build --release -p duckosm-cli
      - name: Test the CLI on the Monaco sample (the counts of tests/test_wheel.py), and make the archive
        shell: bash
        run: |
          set -e
          bin=target/release/duckosm-rust; [ -f $bin.exe ] && bin=$bin.exe
          $bin tests/data/monaco_sample.osm.pbf -o cli-test --modes driving,walking,cycling --no-merge-segments \
            --no-component-filter --no-speeds --no-costs --no-connect-paths --no-sidewalk-inference 2> cli-test.log
          cat cli-test.log
          grep -q "^driving: 3092 edges, 1904 nodes, 724 private edges" cli-test.log
          grep -q "^walking: 12238 edges, 4818 nodes, 166 private edges" cli-test.log
          grep -q "^cycling: 10670 edges, 4867 nodes, 141 private edges" cli-test.log
          mkdir dist
          v=${GITHUB_REF_NAME#v}; [ "$GITHUB_REF_TYPE" = tag ] || v=dev
          if [ -f target/release/duckosm-rust.exe ]; then
            7z a dist/duckosm-rust-$v-${{ matrix.name }}.zip ./target/release/duckosm-rust.exe README.md LICENSE
          else
            tar czf dist/duckosm-rust-$v-${{ matrix.name }}.tar.gz -C target/release duckosm-rust -C ../.. README.md LICENSE
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: cli-${{ matrix.name }}
          path: dist

  sdist:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/duckosm-py/Cargo.toml
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  # A tag v* makes a GitHub Release with the wheels, the sdist and the CLI archives (no PyPI: the name waits for
  # the DuckDB trademark answer, design.md open question 2).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, wheels, cli, sdist]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true
          path: dist
      - name: Make the release and upload the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
