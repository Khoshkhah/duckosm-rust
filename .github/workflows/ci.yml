# CI for duckOSM Studio (github.com/Khoshkhah/duckosm-studio): the browser page. The engine (duckosm-core, -parquet,
# -duckdb, -build, the CLI and the Python module) lives in the duckOSM repository (rust/), with its own tests,
# wheels and release (duckOSM .github/workflows/). This repository takes duckosm-core and duckosm-build from
# there with a Git dependency (crates/duckosm-wasm/Cargo.toml).
name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: the WebAssembly build and its tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: The WebAssembly module builds, and its byte functions give the files of the path functions
        run: |
          cargo build --release -p duckosm-wasm --target wasm32-unknown-unknown
          cargo test --release -p duckosm-wasm
      - name: Nightly Rust for the WebAssembly module with threads
        run: rustup toolchain install nightly-2026-10-15 --profile minimal --component rust-src --target wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Both WebAssembly modules of the page build (one thread, and threads)
        run: ./crates/duckosm-wasm/build.sh
      # The Pages deploy puts a version on every file reference of the page (version_refs.py) and stops when one is left
      # without: check it here on a copy, so that a new file name in roadstyle's files stops the pull request, not the deploy
      - name: Each file reference of the page gets a version
        run: |
          cp -r crates/duckosm-wasm/www "$RUNNER_TEMP/www"
          python3 crates/duckosm-wasm/www/version_refs.py "$RUNNER_TEMP/www" check
      # The test of duckosm-wasm wrote the native files and fixes.yaml to target/tmp/<checkout folder> (one folder for
      # each checkout, because worktrees can share target/). The metadata and the levels metadata hold the build time
      # and the time zone, so they are not compared.
      - name: The WebAssembly module in Node writes the files of the native build (Monaco)
        run: |
          t=target/tmp/$(basename "$PWD")
          node crates/duckosm-wasm/www/run_node.mjs tests/data/monaco.osm.pbf out-node driving,walking,cycling $t/fixes.yaml
          test $(ls out-node | wc -l) = $(ls $t/duckosm-wasm-native | wc -l)
          for f in out-node/*; do
            case ${f##*/} in visualization_metadata_main.parquet|edge_levels_meta_visualization.parquet) continue;; esac
            cmp $f $t/duckosm-wasm-native/${f##*/}
          done
