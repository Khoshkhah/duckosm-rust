[package]
name = "duckosm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "duckosm-rust"
path = "src/main.rs"

[features]
default = ["duckdb"]
duckdb = ["dep:duckosm-duckdb"]

[dependencies]
duckosm-core = { path = "../duckosm-core" }
duckosm-parquet = { path = "../duckosm-parquet" }
duckosm-duckdb = { path = "../duckosm-duckdb", optional = true }
clap = { version = "4", features = ["derive"] }
