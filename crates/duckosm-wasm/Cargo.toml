[package]
name = "duckosm-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
duckosm-core = { path = "../duckosm-core" }
# write_tables and the fixes reader, without DuckDB. zstd is a C library: snap (pure Rust) is the
# compression in WebAssembly.
duckosm-build = { path = "../duckosm-build", default-features = false, features = ["snap"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
# read a region file piece by piece from the browser (Blob.slice and FileReaderSync, in the build worker)
web-sys = { version = "0.3", features = ["Blob", "FileReaderSync"] }
