[package]
name = "duckosm-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The engine is in the duckOSM repository (rust/). One rev for all its crates; docs/development.md, "Where the engine lives".
duckosm-core = { git = "https://github.com/Khoshkhah/duckOSM.git", rev = "39ba8656c6fece5d30deb994a64bf6f3edd06ea7" }
# write_tables and the fixes reader, without DuckDB. zstd is a C library: snap (pure Rust) is the
# compression in WebAssembly.
duckosm-build = { git = "https://github.com/Khoshkhah/duckOSM.git", rev = "39ba8656c6fece5d30deb994a64bf6f3edd06ea7", default-features = false, features = ["snap"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
# read a region file piece by piece from the browser (Blob.slice and FileReaderSync, in the build worker)
web-sys = { version = "0.3", features = ["Blob", "FileReaderSync"] }
# WebAssembly threads (docs/development.md, "WebAssembly threads"): rayon gets a pool of Web Workers. Only in the
# build with the feature "threads", which needs nightly Rust and a page with cross-origin isolation.
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"], optional = true }

[features]
threads = ["dep:wasm-bindgen-rayon"]

[dev-dependencies]
# the tests read the page's time zone table
serde_json = "1"
# the native build of the tests finds the time zone with tzf-rs (the browser module does not have it)
duckosm-build = { git = "https://github.com/Khoshkhah/duckOSM.git", rev = "39ba8656c6fece5d30deb994a64bf6f3edd06ea7", default-features = false, features = ["snap", "tzf"] }
